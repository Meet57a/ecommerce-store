{% extends "base.html" %}

{% block title %}Log in | E-commerce Store{% endblock %}

{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <h1 class="h2 mb-4">Log in</h1>
    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Log in</button>
        <a class="small mt-3" href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
    </form>
</div></div></div>
{% endblock %}
