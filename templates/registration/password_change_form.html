{% extends "base.html" %}
{% block title %}Change password | E-commerce Store{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <h1 class="h2 mb-4">Change password</h1>
    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}{{ form.as_p }}
        <button class="btn btn-primary" type="submit">Change password</button>
    </form>
</div></div></div>
{% endblock %}
