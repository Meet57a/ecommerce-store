{% extends "base.html" %}
{% block title %}Reset password | E-commerce Store{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <h1 class="h2 mb-4">Reset password</h1>
    <p>Enter your email address and we will send reset instructions if an account exists.</p>
    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}{{ form.as_p }}
        <button class="btn btn-primary" type="submit">Send reset email</button>
    </form>
</div></div></div>
{% endblock %}
