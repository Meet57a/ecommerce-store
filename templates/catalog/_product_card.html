<div class="col-sm-6 col-lg-4">
    <div class="card h-100 shadow-sm">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top product-image" alt="{{ product.name }}">
        {% else %}
            <div class="product-placeholder d-flex align-items-center justify-content-center">No image</div>
        {% endif %}
        <div class="card-body d-flex flex-column">
            <p class="small text-muted mb-1">{{ product.category.name }}</p>
            <h3 class="h5 card-title">{{ product.name }}</h3>
            <p class="fw-bold mt-auto mb-3">₹{{ product.price }}</p>
            <a href="{{ product.get_absolute_url }}" class="btn btn-outline-primary">View details</a>
        </div>
    </div>
</div>
